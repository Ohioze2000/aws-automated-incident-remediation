#
name: "Terraform AWS Deploy"

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Prevent parallel runs on the same branch to avoid state locks on TFC
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: "Terraform Cloud Run Engine"
    runs-on: ubuntu-latest
    environment: production

    env:
      TF_CLOUD_ORGANIZATION: "DigitalTech"
      TF_WORKSPACE: "aws-automated-incident-remediation"
      AWS_REGION: "us-east-1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      # --- PIPELINE INITIALIZATION SLACK ALERT ---
      - name: Slack Notification - Started
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: 'good'
          SLACK_TITLE: "Infrastructure Pipeline Status: STARTED"
          SLACK_MESSAGE: "🚀 Triggered native Terraform Cloud remote run execution."

      # GitHub OIDC provides short-lived AWS credentials for runner-side AWS operations.
      # Terraform plan/apply still execute in HCP Terraform, which should use HCP
      # Terraform dynamic AWS provider credentials configured on the workspace.
      - name: Configure AWS Credentials (OIDC)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Verify AWS OIDC Identity
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: aws sts get-caller-identity    

      - name: Terraform Init
        run: terraform init

      # --- SYNTAX & FORMATTING QUALITY GATES ---
      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate  

      # Speculative Plan triggers automatically in TFC during PRs
      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false

      # Remote Apply on merge to main branch
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false

      # --- CAPTURE INFRASTRUCTURE METADATA FROM TFC STATE ---
      - name: Capture Infrastructure Outputs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: tf_outputs
        run: |
          echo "URL=$(terraform output -raw website_url)" >> $GITHUB_OUTPUT
          echo "DOMAIN_NAME=$(terraform output -raw route53_zone_name)" >> $GITHUB_OUTPUT
          echo "ALB_ARN=$(terraform output -raw alb_arn)" >> $GITHUB_OUTPUT
          echo "TARGET_GROUP_ARN=$(terraform output -raw target_group_arn)" >> $GITHUB_OUTPUT
          echo "EC2_SG_ID=$(terraform output -raw ec2_security_group_id)" >> $GITHUB_OUTPUT
          echo "ALB_DNS=$(terraform output -raw alb_dns_name)" >> $GITHUB_OUTPUT

      # --- INFRASTRUCTURE QUALITY GATE (RUNTIME VALIDATION) ---
      - name: Initialize Python Environment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install Runtime Verification Dependencies
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: pip install boto3 requests

      - name: Execute Infrastructure Verification Engine
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          AWS_DEFAULT_REGION: "us-east-1"
          DOMAIN_NAME: ${{ steps.tf_outputs.outputs.DOMAIN_NAME }}
          APP_ENDPOINT: ${{ steps.tf_outputs.outputs.URL }}
          ALB_ARN: ${{ steps.tf_outputs.outputs.ALB_ARN }}
          TARGET_GROUP_ARN: ${{ steps.tf_outputs.outputs.TARGET_GROUP_ARN }}
          EC2_SECURITY_GROUP_ID: ${{ steps.tf_outputs.outputs.EC2_SG_ID }}
          ALB_DNS_NAME: ${{ steps.tf_outputs.outputs.ALB_DNS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ENV_PREFIX: "prod"
        run: python validate_infra.py

      # --- FINAL PIPELINE SUCCESS NOTIFICATION ---
      - name: Slack Notification - Success
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: 'good'
          SLACK_TITLE: "✅ Deployment & Infrastructure Verification SUCCESSFUL"
          SLACK_MESSAGE: "All quality gate checks passed. Active deployment live at: ${{ steps.tf_outputs.outputs.URL }}"

      # --- COMPREHENSIVE PIPELINE FAILURE NOTIFICATION ---
      - name: Slack Notification - Failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: 'danger'
          SLACK_TITLE: "❌ Infrastructure Pipeline Status: FAILED"
          SLACK_MESSAGE: "Infrastructure Provisioning, App Deployment, or Quality Gate Validation FAILED. Inspect GitHub workflow runner logs."